name: Actions Smoke Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'diagnostics/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create heartbeat
        run: echo "GitHub Actions runner works" > heartbeat.txt
      - name: Upload heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat
          path: heartbeat.txt
