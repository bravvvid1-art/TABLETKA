name: Diagnose Android Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'diagnostics/**'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        id: java
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        id: sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        id: npm
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee npm-install.log

      - name: Build web app
        id: web
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee web-build.log

      - name: Create Android project
        id: capadd
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee cap-add.log

      - name: Sync Capacitor
        id: capsync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap-sync.log

      - name: Build APK
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -d android ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug 2>&1 | tee ../gradle-build.log
          else
            echo "android directory does not exist" | tee gradle-build.log
            exit 1
          fi

      - name: Write diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "node=${{ steps.node.outcome }}"
            echo "java=${{ steps.java.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "npm=${{ steps.npm.outcome }}"
            echo "web=${{ steps.web.outcome }}"
            echo "capadd=${{ steps.capadd.outcome }}"
            echo "capsync=${{ steps.capsync.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            for f in npm-install.log web-build.log cap-add.log cap-sync.log gradle-build.log; do
              echo
              echo "===== $f ====="
              if [ -f "$f" ]; then tail -n 80 "$f"; else echo "missing"; fi
            done
          } > diagnostics/build-status.txt

      - name: Commit diagnostics to PR branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/build-status.txt
          git commit -m "Add Android build diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
