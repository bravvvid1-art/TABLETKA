name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        id: npm_install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee npm-install.log

      - name: Build web app
        id: web_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee web-build.log

      - name: Create Android project
        id: cap_add
        shell: bash
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee cap-add.log

      - name: Sync Capacitor
        id: cap_sync
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap-sync.log

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TABLETKA-build-logs
          path: |
            npm-install.log
            web-build.log
            cap-add.log
            cap-sync.log
            gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TABLETKA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest test APK
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: ТАБЛЕТКА — последняя тестовая версия
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Автоматическая тестовая сборка приложения «ТАБЛЕТКА».
            Данные пользователя хранятся локально и сохраняются при обновлении приложения при неизменном appId.
