name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        id: npm_install
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee npm-install.log

      - name: Build web app
        id: web_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee web-build.log

      - name: Create Android project
        id: cap_add
        shell: bash
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee cap-add.log

      - name: Sync Capacitor
        id: cap_sync
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap-sync.log

      - name: Set Android app version
        shell: bash
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/' android/app/build.gradle

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee ../gradle-build.log

      - name: Zipalign unsigned release APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned-unsigned.apk

      - name: Prepare signing tools artifact
        shell: bash
        run: |
          mkdir -p android-signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/lib/

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: TABLETKA-android-signing-tools
          path: android-signing-tools/
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TABLETKA-build-logs
          path: |
            npm-install.log
            web-build.log
            cap-add.log
            cap-sync.log
            gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TABLETKA-release-aligned-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-aligned-unsigned.apk
          if-no-files-found: error

